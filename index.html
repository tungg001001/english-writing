      // TRANSITIONAL WORDS DATASET

        {

          ]
        },
        {
          category: '轉折與對比 (Contrast)',
          words: [
            { word: 'However / Nevertheless', usage: '然而、儘管如此（高階轉折副詞）', example: 'The initial market trial faced setback; nevertheless, the team refined the prototype.' },
            { word: 'On the contrary', usage: '恰恰相反（用於否定前言並提出相反事實）', example: 'He is far from inexperienced; on the contrary, he has managed global supply chains for a decade.' },

          category: '因果關係 (Cause & Effect)',

          category: '舉例與闡釋 (Exemplification)',
          words: [

            { word: 'Specifically / In particular', usage: '具體而言、特別是（用於限縮範圍精準說明）', example: 'The standard applies to all exports, specifically those bound for the European Union.' }

        // AI Review State
        const [isAnalyzing, setIsAnalyzing] = useState(false);

        const [apiError, setApiError] = useState(null);

        // Toast State
        const [toastMsg, setToastMsg] = useState(null);

        // Transition tab states
        const [searchKeyword, setSearchKeyword] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');

          const trimmed = userEssay.trim();
          if (!trimmed) return { words: 0, chars: 0, readingTime: 0 };

        const showToast = (msg) => {

          setEssayPrompt(p.prompt);
          setUserEssay(p.sampleText);
          setAiFeedback(null);
          setApiError(null);
        };

        const handleCopyText = (text, label = "內容") => {
          // Standard document.execCommand fallback for iframe safety
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            showToast(`已複製 ${label} 至剪貼簿！`);
          } catch (err) {
            console.error('Copy failed', err);
          }
          document.body.removeChild(textarea);
        };

        // Gemini API Essay Analysis
        const analyzeEssayWithGemini = async () => {
          if (!userEssay.trim()) {
            alert('請先輸入或粘貼您的英文文章！');
            return;
          }

          setIsAnalyzing(true);
          setAiFeedback(null);
          setApiError(null);

          const apiKey = ""; // Canvas runtime auto-injects
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const systemPrompt = `你是一位權威的英文寫作指導教授與雅思/托福權威考官。請依據使用者提供的作文題目與草稿內容進行精細的實時批改。請嚴格以繁體中文 (zh-TW) 提供回覆，唯獨英文範例與句子保持英文。

請使用 JSON 格式輸出，必須符合以下 Schema Structure：
{
  "overallScore": 82, (0-100分的綜合評分)
  "scoreBreakdown": {
    "grammarAndVocab": "文法與詞彙多樣性評語",
    "structureAndCoherence": "文章結構與句構連貫性評語",
    "contentAndTaskAchievement": "內容切題度與論證深度評語"
  },
  "strengths": ["優點點評 1", "優點點評 2"],
  "weaknesses": ["需改進點 1", "需改進點 2"],
  "grammarCorrections": [
    {
      "original": "原本有瑕疵或錯誤的句子",
      "corrected": "修正後高階道地的英文句子",
      "reason": "詳細中文說明文法錯誤、用語不當或潤飾原因"
    }
  ],
  "improvedVersion": "完全重寫潤飾後的高分英文範本全文 (劃分為清晰段落)"
}`;

                  </div>

                  {/* SECTION A: SENTENCE ENHANCER AI TOOL */}
                  <div className="bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 text-white p-6 sm:p-8 rounded-3xl shadow-xl space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-indigo-800/80 pb-4">
                      <div>
                        <span className="px-2.5 py-1 bg-indigo-500/30 text-indigo-200 text-xs font-extrabold rounded-md border border-indigo-400/30 inline-block mb-1">
                          ✨ BONUS TOOL
                        </span>
                        <h3 className="text-lg sm:text-xl font-extrabold tracking-tight">AI 換句話說與句型升級器 (Sentence Elevator)</h3>
                      </div>
                      <span className="text-xs text-indigo-300">輸入簡單英文，一鍵轉換為高階句型</span>
                    </div>

                    <div className="space-y-3">
                      <div className="flex flex-wrap gap-2 text-xs">
                        <span className="text-indigo-300 font-bold self-center">快速試用預設句：</span>
                        {ENHANCER_PRESETS.map((preset, i) => (
                          <button
                            key={i}
                            onClick={() => setInputSentence(preset)}
                            className="px-2.5 py-1 bg-indigo-800/50 hover:bg-indigo-700/60 text-indigo-100 rounded-lg border border-indigo-700 text-[11px] transition-colors"
                          >
                            "{preset.substring(0, 24)}..."
                          </button>
                        ))}
                      </div>

                      <div className="flex flex-col sm:flex-row gap-3">
                        <input
                          type="text"
                          value={inputSentence}
                          onChange={(e) => setInputSentence(e.target.value)}
                          placeholder="例如: I think this problem is very bad..."
                          className="flex-1 px-4 py-3 bg-slate-800/90 border border-indigo-700/60 rounded-xl text-xs sm:text-sm font-medium text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400"
                        />
                        <button
                          onClick={enhanceSentenceWithGemini}
                          disabled={isEnhancing}
                          className="px-6 py-3 bg-indigo-500 hover:bg-indigo-400 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center space-x-2 shrink-0 shadow-md"
                        >
                          <Icon name="sparkles" className={`w-4 h-4 ${isEnhancing ? 'animate-spin' : ''}`} />
                          <span>{isEnhancing ? '生成中...' : '句型三重升級'}</span>
                        </button>
                      </div>
                    </div>

                    {/* Enhancer Results */}
                    {enhancements && (
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-indigo-800/60 animate-fadeIn">
                        {/* Academic Style */}
                        <div className="bg-slate-800/80 p-4 rounded-xl border border-indigo-500/30 space-y-2">
                          <span className="text-xs font-extrabold text-indigo-300 uppercase tracking-wider block">🎓 學術論文風格 (Academic)</span>
                          <p className="text-xs sm:text-sm font-bold text-white leading-relaxed">"{enhancements.academic?.sentence}"</p>
                          <p className="text-[11px] text-slate-300 border-t border-slate-700/60 pt-2">{enhancements.academic?.explanation}</p>
                        </div>
                        {/* Business Style */}
                        <div className="bg-slate-800/80 p-4 rounded-xl border border-indigo-500/30 space-y-2">
                          <span className="text-xs font-extrabold text-emerald-300 uppercase tracking-wider block">💼 正式商務風格 (Business)</span>
                          <p className="text-xs sm:text-sm font-bold text-white leading-relaxed">"{enhancements.business?.sentence}"</p>
                          <p className="text-[11px] text-slate-300 border-t border-slate-700/60 pt-2">{enhancements.business?.explanation}</p>
                        </div>
                        {/* Vivid Style */}
                        <div className="bg-slate-800/80 p-4 rounded-xl border border-indigo-500/30 space-y-2">
                          <span className="text-xs font-extrabold text-amber-300 uppercase tracking-wider block">🎨 生動修辭風格 (Vivid)</span>
                          <p className="text-xs sm:text-sm font-bold text-white leading-relaxed">"{enhancements.vivid?.sentence}"</p>
                          <p className="text-[11px] text-slate-300 border-t border-slate-700/60 pt-2">{enhancements.vivid?.explanation}</p>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* SECTION B: TRANSITIONAL WORDS DIRECTORY */}
                  <div className="space-y-6">
                    {/* Search & Filter Bar */}
                    <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row gap-4 justify-between items-center">
                      {/* Category Filters */}
                      <div className="flex flex-wrap gap-1.5 w-full sm:w-auto">
                        {['All', '遞進', '轉折', '因果', '舉例', '總結'].map((cat) => (
                          <button
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                              selectedCategory === cat
                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs'
                                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                            }`}
                          >
                            {cat === 'All' ? '全部類別' : cat}
                          </button>
                        ))}
                      </div>

                      {/* Search Bar */}
                      <div className="relative w-full sm:w-64">
                        <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                        <input
                          type="text"
                          value={searchKeyword}
                          onChange={(e) => setSearchKeyword(e.target.value)}
                          placeholder="搜尋轉折詞或例句..."
                          className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                    </div>

                    {/* Word Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredTransitions.map((cat, idx) => (
                        <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4 flex flex-col justify-between">
                          <div className="space-y-4">
                            <h3 className="text-sm font-extrabold text-indigo-900 border-b border-slate-100 pb-3 flex items-center justify-between">
                              <span>{cat.category}</span>
                              <span className="text-[10px] px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full font-bold">
                                {cat.words.length} 個高階詞
                              </span>
                            </h3>

                            <div className="space-y-3.5">
                              {cat.words.map((item, j) => (
                                <div key={j} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200/60 space-y-1.5 text-xs">
                                  <div className="flex justify-between items-start">
                                    <span className="font-black text-indigo-800 text-sm">{item.word}</span>
                                    <button
                                      onClick={() => handleCopyText(item.word, "轉折詞")}
                                      className="text-slate-400 hover:text-indigo-600"
                                      title="複製詞彙"
                                    >
                                      <Icon name="copy" className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                  <span className="text-slate-500 block text-[11px] font-medium">{item.usage}</span>
                                  <p className="text-slate-800 font-medium italic pt-1 text-[11px] border-t border-slate-200/50 mt-1">
                                    "{item.example}"
                                  </p>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {filteredTransitions.length === 0 && (
                      <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400 text-xs">
                        找不到符合「{searchKeyword}」的轉折詞。
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
              <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
                <p className="font-medium">WritingMaster 英文寫作大師 • AI 實時作文批改與結構化寫作訓練平台</p>
                <p className="text-slate-400 text-[11px]">Powered by Gemini 3 Flash API</p>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
