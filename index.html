    <script type="text/babel">

          'alert-triangle': <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>

      // Notification Toast Helper
      const Toast = ({ message, onClose }) => {
        useEffect(() => {
          const timer = setTimeout(onClose, 3000);
          return () => clearTimeout(timer);

        return (
          <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-2 text-xs sm:text-sm font-medium animate-fadeIn">

            <span>{message}</span>
          </div>

      };

      // ESSAY TEMPLATES DATASET
      const ESSAY_TEMPLATES = [
        {
          id: 'opinion',
          title: '學術議論文 (Academic Argumentative Essay)',
          category: '學術與考試 (IELTS / TOEFL / 學測)',
          description: '適用於針對爭議性議題表達明確立場，運用邏輯論證、實證例證與反駁觀點。',
          structure: [
            { section: '1. 引言段 (Introduction)', tip: 'Hook + 背景引述 + Clear Thesis Statement', example: 'Recently, the rapid integration of artificial intelligence in education has sparked heated debates. While critics argue that AI undermines critical thinking, I firmly maintain that it acts as a transformative catalyst for personalized learning.' },
            { section: '2. 第一支持段 (Body Paragraph 1)', tip: 'Topic Sentence + 核心論據 + 具體舉例', example: 'To begin with, AI-driven platforms empower students to learn at their tailored pace. For instance, intelligent tutoring systems can dynamically adapt difficulty levels based on individual progress, thereby bridging learning gaps.' },
            { section: '3. 第二支持段 / 對立觀點駁斥 (Counter-Argument & Refutation)', tip: '承認對立觀點 + 展現批判性反駁邏輯', example: 'Admittedly, opponents contend that reliance on AI may induce intellectual laziness. However, this concern overlooks the role of teachers, who can guide students to utilize AI ethically as an auxiliary research tool.' },
            { section: '4. 結論段 (Conclusion)', tip: '重申立場 + 摘要要點 + 終極前瞻展望', example: 'In conclusion, despite potential drawbacks, the benefits of educational AI far outweigh its risks. To thrive in the digital age, educational institutions should actively foster AI literacy rather than impose outright bans.' }
          ]
        },
        {
          id: 'narrative-life',
          title: '個人故事與生活經驗 (Personal Narrative Essay)',
          category: '日常寫作與留學自述 (SOP / Essay)',
          description: '適用於描繪關鍵人生經歷、困境突破、旅行震撼或深遠影響的個人轉折。',
          structure: [
            { section: '1. 故事背景與懸念 (Setting & Hook)', tip: '營造感官細節、交代時間地點與懸念點', example: 'Looking back on my adolescent years, one unexpected cross-country hiking trip completely redefined my perception of resilience.' },
            { section: '2. 危機與轉折 (Rising Action & Challenge)', tip: '深入刻畫內心衝突、突破瞬間與心理變化', example: 'When our team encountered a sudden mountain storm, fear engulfed us. As twilight faded, keeping morale high became far more challenging than navigating the treacherous path.' },
            { section: '3. 體悟與問題解決 (Resolution & Insight)', tip: '說明考驗如何結束以及獲得的生命啟示', example: 'Through mutual support and methodical decision-making, we reached safety by midnight. This ordeal illuminated the extraordinary power of collective perseverance.' },
            { section: '4. 反思結語 (Reflective Conclusion)', tip: '結合當前生活，說明該經歷對未來的深遠意義', example: 'Whenever I confront formidable challenges today, I draw inspiration from that stormy night, remaining calm and steadfast under pressure.' }
          ]
        },
        {
          id: 'complaint-review',
          title: '正式投訴與問題反映信 (Formal Complaint & Feedback Letter)',
          category: '實用書信與生活溝通',
          description: '適用於針對消費品質瑕疵、服務缺失或合約維修爭議提出客觀且強而有力的訴求。',
          structure: [
            { section: '1. 寫信目的與交易背景 (Purpose & Transaction Details)', tip: '明確指出消費日期、訂單編號及開門見山點出主旨', example: 'I am writing to formally register my dissatisfaction regarding the accommodation service provided at your resort from October 12th to 15th (Booking Ref: #8821).' },
            { section: '2. 客觀事實驗證 (Factual Description of the Problem)', tip: '列舉具體不符合品質標準的點，維持冷靜客觀立場', example: 'Upon arrival, the air conditioning unit in Suite 402 was completely inoperable. Despite reporting this issue twice to the front desk, no technician was dispatched during our stay.' },
            { section: '3. 補償要求與解決方案 (Proposed Remedy & Call to Action)', tip: '合理提出退款、折換卷或立即更新處理', example: 'Given the significant inconvenience caused during our family vacation, I believe a partial refund of 30% of the booking fee is both fair and reasonable.' },
            { section: '4. 結尾與明確期限 (Polite Closing with Deadline)', tip: '訂出期待回覆的期限，展現堅定立場', example: 'I trust you will handle this matter with urgency. I look forward to receiving your response and confirmation of refund within five business days.' }
          ]
        },
        {
          id: 'email-formal',
          title: '商務商談與合作 Email (Formal Business Proposal Email)',
          category: '職場與商務應用',
          description: '適用於洽談跨國合作、產品詢價、提案跟進或商務簡報邀請。',
          structure: [
            { section: '1. 專業主旨與稱呼 (Subject & Salutation)', tip: '主旨明確簡潔，使用高階商業稱呼', example: 'Subject: Partnership Proposal: Joint Digital Marketing Campaign Q3\n\nDear Ms. Henderson,' },
            { section: '2. 合作契機與目的 (Purpose & Context)', tip: '引述前情或直接說明寫信意圖', example: 'I am writing on behalf of Nexa Tech to explore potential synergies between our AI platforms and your distribution network in Southeast Asia.' },
            { section: '3. 核心價值與下一步行動 (Value Proposition & Call to Action)', tip: '點出雙贏優勢並約定線上會議時間', example: 'Our analytical tools could enhance your user engagement by 25%. Would you be available for a brief 20-minute video conference next Tuesday at 10:00 AM EST?' },
            { section: '4. 專業簽署 (Professional Sign-off)', tip: '高階禮貌結語與完整簽名檔', example: 'Thank you for your time and consideration. I look forward to your favorable response.\n\nSincerely,\nJohn Doe\nHead of Business Development | Nexa Tech' }
          ]
        },
        {
          id: 'chart-analysis',
          title: '圖表分析與數據報告 (Data & Chart Description Essay)',
          category: '學術與考試 (IELTS Task 1 / 商業報告)',
          description: '適用於描述折線圖、柱狀圖、圓餅圖趨勢，進行數據對比與客觀總結。',
          structure: [
            { section: '1. 圖表轉述 (Overview / Paraphrase)', tip: '改寫題目，說明圖表主題、單位與時間跨度', example: 'The line graph illustrates the fluctuations in renewable energy consumption across five European nations between 2010 and 2023.' },
            { section: '2. 主要趨勢亮點 (Key Features & Main Trends)', tip: '指出最顯著的上升、下降或交叉點，避免列舉細節', example: 'Overall, solar power experienced the most dramatic growth, whereas reliance on coal witnessed a steady decline over the thirteen-year period.' },
            { section: '3. 詳細數據與細節對比 (Detailed Data Comparison)', tip: '運用精確數據與轉折比較詞，分組比較數據', example: 'In 2010, solar energy accounted for a modest 5% of total grid output; however, this figure surged dramatically to 35% by the end of 2023.' },
            { section: '4. 總結觀點 (Concluding Summary)', tip: '對整體趨勢給出簡潔客觀的歸納結論', example: 'In summary, the data clearly reflects a progressive transition toward sustainable energy sources throughout the surveyed timeframe.' }
          ]
        }
      ];

      // TRANSITIONAL WORDS DATASET
      const TRANSITION_WORDS = [
        {
          category: '遞進與補充 (Addition)',
          words: [
            { word: 'Furthermore / Moreover', usage: '此外、再者（用於引出更具說服力的論點）', example: 'Furthermore, implementing green technologies will reduce operational costs in the long run.' },
            { word: 'In addition to', usage: '除了...之外（後接名詞或 V-ing）', example: 'In addition to enhancing memory, quality sleep boosts immune function.' },
            { word: 'Not only... but also', usage: '不僅...而且...（雙重強調語氣）', example: 'The strategic pivot not only saved the venture but also expanded its market share.' }
          ]
        },
        {
          category: '轉折與對比 (Contrast)',
          words: [
            { word: 'However / Nevertheless', usage: '然而、儘管如此（高階轉折副詞）', example: 'The initial market trial faced setback; nevertheless, the team refined the prototype.' },
            { word: 'On the contrary', usage: '恰恰相反（用於否定前言並提出相反事實）', example: 'He is far from inexperienced; on the contrary, he has managed global supply chains for a decade.' },
            { word: 'While / Whereas', usage: '而...相比之下...（常用於句中對比兩事物）', example: 'Desktop sales stagnated, whereas mobile subscription revenue surged.' }
          ]
        },
        {
          category: '因果關係 (Cause & Effect)',
          words: [
            { word: 'Consequently / As a result', usage: '結果是、因此（引出最終邏輯結果）', example: 'Raw material prices escalated; consequently, the profit margin compressed.' },
            { word: 'Therefore / Hence', usage: '因此、由是觀之（學術論述常用推論詞）', example: 'The experimental controls were flawed; hence, the data must be re-evaluated.' },
            { word: 'Due to / Owing to', usage: '由於、因為（後接名詞片語）', example: 'Owing to stringent safety protocols, zero workplace incidents were reported this quarter.' }
          ]
        },
        {
          category: '舉例與闡釋 (Exemplification)',
          words: [
            { word: 'To illustrate / For instance', usage: '舉例來說（較比 For example 更具學術感）', example: 'To illustrate this principle, consider how micro-financing empowered rural entrepreneurs.' },
            { word: 'Specifically / In particular', usage: '具體而言、特別是（用於限縮範圍精準說明）', example: 'The standard applies to all exports, specifically those bound for the European Union.' }
          ]
        },
        {
          category: '總結與歸納 (Concluding)',
          words: [
            { word: 'In conclusion / To sum up', usage: '總而言之、綜上所述（文章最後一段開頭）', example: 'In conclusion, economic growth must be reconciled with ecological preservation.' },
            { word: 'All in all / On the whole', usage: '整體而言、總體來看（簡短綜合觀點）', example: 'All in all, the conference provided invaluable insights into emerging AI trends.' }
          ]
        }
      ];

      // PRESET ESSAY PROMPTS
      const PRESET_PROMPTS = [
        {
          id: 1,
          topic: 'AI與就業前景',
          prompt: 'Do you agree or disagree that artificial intelligence will replace human jobs in the future? Give reasons and examples to support your answer.',
          sampleText: 'In recent years, artificial intelligence has made huge progress. Many people worry that AI will take away millions of human jobs in the near future. I agree with this idea because AI works faster than humans and does not need rest. For example, robots in factories can work 24 hours without making mistakes. Also, AI can write articles and code programs very fast. However, some people think new jobs will be created. But I think many workers will lose their jobs before they can learn new skills. So we must be careful.'
        },
        {
          id: 2,
          topic: '科技與環境永續',
          prompt: 'Some people believe that economic development should take priority over environmental protection. To what extent do you agree or disagree?',
          sampleText: 'Economic development is very important for every country to help people live better lives. However, I strongly disagree that economy should be more important than protecting the environment. If we destroy nature for money, we will face terrible weather and pollution. For example, many factory pollution causes climate change and damages health. Without a clean earth, economic growth is useless. Therefore, protecting environment should always be our first choice.'
        },
        {
          id: 3,
          topic: '遠距與數位學習',
          prompt: 'Online learning has become increasingly popular. Do the advantages of online education outweigh its disadvantages?',
          sampleText: 'With fast internet, online education is getting very popular today. In my opinion, the advantages of online learning are much bigger than its disadvantages. First, students can study anytime and anywhere without travelling. Second, online platforms offer many free courses from top universities. On the other hand, students might lack self-discipline and miss social life. But overall, flexibility makes online learning a great choice.'
        },
        {
          id: 4,
          topic: '社群媒體與心理健康',
          prompt: 'Discuss both the positive and negative impacts of social media on young people.',
          sampleText: 'Social media like Instagram and TikTok are part of daily life for teenagers. On the positive side, social media helps young people stay connected with friends and learn news instantly. However, the negative impact is also serious. Many teenagers spend too much time scrolling and feel anxious when comparing themselves to others online. Cyberbullying is another big problem. In conclusion, social media brings convenience but also mental health pressure.'
        },
        {
          id: 5,
          topic: '工作與生活平衡',
          prompt: 'Many employees struggle to achieve a work-life balance in modern society. What are the causes of this problem, and what solutions can be proposed?',
          sampleText: 'Today, work-life balance has become a big challenge for many workers. The main cause is smart phones, because boss can send messages anytime even after working hours. Another reason is heavy workload in competitive companies. To solve this problem, companies should set rules that ban late night emails. Also, workers need to manage their time better and learn to relax during weekends.'
        }
      ];

      // PRESET SENTENCES FOR ENHANCER TOOL
      const ENHANCER_PRESETS = [
        "I think this idea is very good and useful.",
        "This problem is very bad and makes people unhappy.",
        "Many people believe that money can buy happiness.",
        "The government should give more money to help poor students."
      ];

      // Dynamic Pure-Local Analysis Engine (No API Key Required & Dynamic per Essay)
      const runSmartLocalAnalysis = (prompt, text) => {
        const cleanText = text.trim();
        const sentences = cleanText.split(/(?<=[.!?])\s+/).filter(Boolean);
        const sentenceCount = sentences.length || 1;
        const words = cleanText.split(/\s+/).filter(Boolean);
        const wordCount = words.length;
        const avgSentenceLength = Math.round(wordCount / sentenceCount);

        // Word variety check (Unique words ratio)
        const uniqueWords = new Set(words.map(w => w.toLowerCase().replace(/[^a-z]/g, '')));
        const lexicalDiversity = Math.min(Math.round((uniqueWords.size / (wordCount || 1)) * 100), 100);

        // Count academic / complex transition markers
        const transitionMatches = (cleanText.match(/\b(however|furthermore|moreover|consequently|therefore|nevertheless|in addition|for instance|to illustrate|on the other hand|in conclusion)\b/gi) || []).length;
        
        // Calculate Dynamic Scores
        let score = 60;
        if (wordCount >= 200) score += 15;
        else if (wordCount >= 120) score += 10;
        else if (wordCount >= 60) score += 5;

        if (lexicalDiversity > 60) score += 12;
        else if (lexicalDiversity > 40) score += 8;

        if (transitionMatches >= 3) score += 10;
        else if (transitionMatches >= 1) score += 5;

        if (avgSentenceLength >= 12 && avgSentenceLength <= 25) score += 8;

        score = Math.min(Math.max(score, 55), 96);

        // Dynamic Rule Matcher & Sentence Replacement List
        const replacementRules = [
          { pattern: /\bmade huge progress\b/gi, replacement: "achieved substantial advancement", note: "將通俗的 made huge progress 替換為學術動詞名詞搭配 achieved substantial advancement。" },
          { pattern: /\btake away millions of human jobs\b/gi, replacement: "displace a significant portion of the workforce", note: "採用專業就業市場詞彙 displace workforce 替代口語化表達。" },
          { pattern: /\bvery important\b/gi, replacement: "of paramount importance", note: "將副詞很重要的 very important 升級為介詞高階片語 of paramount importance。" },
          { pattern: /\bvery popular\b/gi, replacement: "increasingly prevalent", note: "使用學術形容詞 prevalent 來描述現象普及。" },
          { pattern: /\bvery good\b/gi, replacement: "highly advantageous", note: "形容詞升級：用 highly advantageous 替代過於頻繁出現的 good。" },
          { pattern: /\bvery bad\b/gi, replacement: "severely detrimental", note: "形容詞升級：用 detrimental 強化負面影響的警示感。" },
          { pattern: /\bI think\b/gi, replacement: "From my point of view", note: "避免過於強烈的主觀一號稱呼 I think，改用客觀引述語帶入論點。" },
          { pattern: /\bmany people\b/gi, replacement: "a substantial number of individuals", note: "將基礎名詞 many people 擴充為高級量詞與名詞組合。" },
          { pattern: /\bbig problem\b/gi, replacement: "pressing challenge", note: "用 pressing challenge 替代大問題，使語氣更精準專業。" },
          { pattern: /\bmake progress\b/gi, replacement: "demonstrate measurable improvement", note: "用 demonstrate measurable improvement 代替口語動詞進步。" }
        ];

        const corrections = [];
        let modifiedText = cleanText;

        replacementRules.forEach(rule => {
          const matches = cleanText.match(rule.pattern);
          if (matches) {
            const originalMatch = matches[0];
            if (!corrections.some(c => c.original.toLowerCase() === originalMatch.toLowerCase())) {
              corrections.push({
                original: originalMatch,
                corrected: rule.replacement,
                reason: rule.note
              });
            }
            modifiedText = modifiedText.replace(rule.pattern, rule.replacement);
          }
        });

        if (corrections.length === 0) {
          sentences.slice(0, 2).forEach(s => {
            if (s.length > 10) {
              corrections.push({
                original: s.trim(),
                corrected: `Furthermore, ${s.replace(/^I think/i, 'it can be observed that').trim()}`,
                reason: "優化句子開頭，加入邏輯銜接副詞以增強句構間的推進感。"
              });
            }
          });
        }

        const grammarAndVocab = `文章總計 ${wordCount} 字，使用了約 ${uniqueWords.size} 個獨立詞彙（詞彙豐富度 ${lexicalDiversity}%）。${
          lexicalDiversity < 50 ? '建議減少常用詞彙（如 good, bad, many）的重複次數。' : '展現了良好的詞彙運用靈活性。'
        }`;

        const structureAndCoherence = `平均句長約 ${avgSentenceLength} 字/句。文中包含 ${transitionMatches} 個邏輯銜接轉折詞。${
          transitionMatches < 2 ? '建議適度增加如 Furthermore, However, Consequently 等高級連接詞。' : '段落轉折與邏輯推論鋪陳相當連貫。'
        }`;

        const contentAndTaskAchievement = `文章回應了議題「${prompt || '寫作題目'}」。針對核心觀點切入清晰，完整呈現了個人論述方向。`;

        return {
          overallScore: score,
          scoreBreakdown: {
            grammarAndVocab,
            structureAndCoherence,
            contentAndTaskAchievement
          },
          strengths: [
            `文章長度達到 ${wordCount} 字，符合標準篇幅要求`,
            lexicalDiversity > 45 ? "詞彙重複率低，具備基礎的豐富度" : "主題論述立場明確，語意表達清晰"
          ],
          weaknesses: [
            transitionMatches < 2 ? "段落銜接詞偏少，文意轉折可再加強" : "句型結構偏向單一，可適度加入從句或倒裝句",
            "部分形容詞與動詞搭配有進一步道地化的空間"
          ],
          grammarCorrections: corrections,
          improvedVersion: modifiedText
        };
      };

      const runSmartLocalEnhancement = (sentence) => {
        const trimmed = sentence.trim();
        return {
          academic: {
            sentence: trimmed.replace(/good/gi, "highly beneficial").replace(/bad/gi, "severely detrimental").replace(/I think/gi, "Evidence indicates that").replace(/many people/gi, "a significant portion of the populace"),
            explanation: "替換基礎口語形容詞，並使用更加客觀學術的第三人稱引述。"
          },
          business: {
            sentence: trimmed.replace(/good/gi, "cost-effective and advantageous").replace(/bad/gi, "counterproductive").replace(/I think/gi, "From a strategic standpoint,").replace(/many people/gi, "key industry stakeholders"),
            explanation: "融入商業溝通情境用語（如語氣更加專業務實的詞彙及觀點引導）。"
          },
          vivid: {
            sentence: trimmed.replace(/good/gi, "remarkably exceptional").replace(/bad/gi, "disastrous").replace(/I think/gi, "It is overwhelmingly evident that").replace(/many people/gi, "countless individuals"),
            explanation: "運用生動修辭與強烈情緒形容詞，強化文意的視覺渲染感與說服力。"
          }
        };
      };

        const [enhancements, setEnhancements] = useState(null);

          const chars = userEssay.length;
          const readingTime = Math.ceil(words / 200);
          return { words, chars, readingTime };

            console.error('Copy failed', err);

            return;

          setAiFeedback(null);

            const feedback = runSmartLocalAnalysis(essayPrompt, userEssay);
            setAiFeedback(feedback);
            setIsAnalyzing(false);

          setEnhancements(null);

            const res = runSmartLocalEnhancement(inputSentence);
            setEnhancements(res);
            setIsEnhancing(false);

            const filteredWords = cat.words.filter((w) =>
              w.word.toLowerCase().includes(searchKeyword.toLowerCase()) ||
              w.usage.includes(searchKeyword) ||
              w.example.toLowerCase().includes(searchKeyword.toLowerCase())

          }).filter(Boolean);

                          <h3 className="font-extrabold text-slate-900 text-base pt-2">{tmpl.title}</h3>
                          <p className="text-xs text-slate-500 leading-relaxed">{tmpl.description}</p>
                        </div>

                        <div className="space-y-3 pt-2">
                          {tmpl.structure.map((sec, idx) => (
                            <div key={idx} className="p-3.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1.5 text-xs">
                              <div className="flex justify-between items-center font-bold text-slate-800">
                                <span>{sec.section}</span>
                                <span className="text-[10px] text-indigo-600 font-semibold bg-white px-2 py-0.5 rounded border border-slate-200">{sec.tip}</span>
                              </div>
                              <p className="text-slate-600 italic font-mono bg-white p-2.5 rounded-lg border border-slate-200/60 leading-relaxed">
                                "{sec.example}"
                              </p>
                              <div className="text-right pt-1">
                                <button
                                  onClick={() => handleCopyText(sec.example, sec.section)}
                                  className="text-[11px] font-bold text-indigo-600 hover:underline inline-flex items-center space-x-1"
                                >
                                  <Icon name="copy" className="w-3 h-3" />
                                  <span>複製例句</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: TRANSITIONAL WORDS & SENTENCE ENHANCER */}
              {activeTab === 'transitions' && (
                <div className="space-y-8 animate-fadeIn">
                  {/* Tool 1: AI Sentence Enhancer */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                    <div className="border-b border-slate-100 pb-3">
                      <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider flex items-center space-x-1.5">
                        <Icon name="sparkles" className="w-4 h-4" />
                        <span>「換句話說」句子三升級工具 (Sentence Enhancer)</span>
                      </span>
                      <p className="text-xs text-slate-500 mt-1">輸入一句平淡或基礎的英文句子，自動升級為學術、商務與生動修辭等 3 種語氣表達。</p>
                    </div>

                    <div className="space-y-3">
                      <div className="flex flex-wrap gap-2 text-xs">
                        <span className="text-slate-400 font-bold self-center">預設測試句:</span>
                        {ENHANCER_PRESETS.map((preset, idx) => (
                          <button
                            key={idx}
                            onClick={() => setInputSentence(preset)}
                            className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors truncate max-w-[200px]"
                          >
                            {preset}
                          </button>
                        ))}
                      </div>

                      <div className="flex flex-col sm:flex-row gap-2">
                        <input
                          type="text"
                          value={inputSentence}
                          onChange={(e) => setInputSentence(e.target.value)}
                          placeholder="例如：I think this idea is very good..."
                          className="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 focus:outline-none focus:border-indigo-500 transition-colors"
                        />
                        <button
                          onClick={enhanceSentenceLocally}
                          disabled={isEnhancing}
                          className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-xs transition-all flex items-center justify-center space-x-2 shrink-0 disabled:opacity-50"
                        >
                          {isEnhancing ? (
                            <>
                              <Icon name="refresh-cw" className="w-4 h-4 animate-spin" />
                              <span>分析改寫中...</span>
                            </>
                          ) : (
                            <>
                              <Icon name="sparkles" className="w-4 h-4" />
                              <span>一鍵替換升級</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>

                    {/* Enhancements Output */}
                    {enhancements && (
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-3 animate-fadeIn">
                        {/* Academic */}
                        <div className="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl space-y-2">
                          <span className="px-2 py-0.5 bg-indigo-600 text-white rounded text-[10px] font-extrabold uppercase">
                            學術風格 (Academic)
                          </span>
                          <p className="text-xs font-mono font-bold text-slate-900 leading-relaxed pt-1">
                            "{enhancements.academic.sentence}"
                          </p>
                          <p className="text-[11px] text-slate-500 pt-1 border-t border-indigo-100">
                            💡 {enhancements.academic.explanation}
                          </p>
                          <button
                            onClick={() => handleCopyText(enhancements.academic.sentence, "學術句子")}
                            className="text-[11px] font-bold text-indigo-600 hover:underline flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製句子</span>
                          </button>
                        </div>

                        {/* Business */}
                        <div className="p-4 bg-emerald-50/50 border border-emerald-100 rounded-xl space-y-2">
                          <span className="px-2 py-0.5 bg-emerald-600 text-white rounded text-[10px] font-extrabold uppercase">
                            商務正式 (Formal Business)
                          </span>
                          <p className="text-xs font-mono font-bold text-slate-900 leading-relaxed pt-1">
                            "{enhancements.business.sentence}"
                          </p>
                          <p className="text-[11px] text-slate-500 pt-1 border-t border-emerald-100">
                            💡 {enhancements.business.explanation}
                          </p>
                          <button
                            onClick={() => handleCopyText(enhancements.business.sentence, "商務句子")}
                            className="text-[11px] font-bold text-emerald-600 hover:underline flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製句子</span>
                          </button>
                        </div>

                        {/* Vivid */}
                        <div className="p-4 bg-amber-50/50 border border-amber-100 rounded-xl space-y-2">
                          <span className="px-2 py-0.5 bg-amber-600 text-white rounded text-[10px] font-extrabold uppercase">
                            生動修辭 (Vivid)
                          </span>
                          <p className="text-xs font-mono font-bold text-slate-900 leading-relaxed pt-1">
                            "{enhancements.vivid.sentence}"
                          </p>
                          <p className="text-[11px] text-slate-500 pt-1 border-t border-amber-100">
                            💡 {enhancements.vivid.explanation}
                          </p>
                          <button
                            onClick={() => handleCopyText(enhancements.vivid.sentence, "生動句子")}
                            className="text-[11px] font-bold text-amber-600 hover:underline flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製句子</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Tool 2: Transition Words Dictionary */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                      <div>
                        <h2 className="font-extrabold text-slate-900 text-base">高階英文轉折詞與邏輯銜接字典</h2>
                        <p className="text-xs text-slate-500 mt-0.5">提升作文句構連貫性（Coherence & Cohesion）的必備靈感庫。</p>
                      </div>

                      <div className="flex items-center space-x-2 w-full sm:w-auto">
                        <div className="relative flex-1 sm:w-48">
                          <input
                            type="text"
                            value={searchKeyword}
                            onChange={(e) => setSearchKeyword(e.target.value)}
                            placeholder="搜尋轉折詞或關鍵字..."
                            className="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500"
                          />
                          <Icon name="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" />
                        </div>
                      </div>
                    </div>

                    <div className="space-y-6">
                      {filteredTransitions.length === 0 ? (
                        <div className="text-center py-8 text-xs text-slate-400">
                          未找到匹配的轉折詞，請嘗試替換關鍵字。
                        </div>
                      ) : (
                        filteredTransitions.map((cat, idx) => (
                          <div key={idx} className="space-y-3">
                            <h3 className="text-xs font-extrabold text-indigo-700 uppercase tracking-wider flex items-center space-x-1.5">
                              <span className="w-2 h-2 bg-indigo-600 rounded-full"></span>
                              <span>{cat.category}</span>
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                              {cat.words.map((item, itemIdx) => (
                                <div key={itemIdx} className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl space-y-2 hover:bg-white hover:border-indigo-200 transition-all text-xs">
                                  <div className="flex justify-between items-center">
                                    <span className="font-extrabold text-slate-900 font-mono text-sm">{item.word}</span>
                                    <button
                                      onClick={() => handleCopyText(item.word, "轉折詞")}
                                      className="text-slate-400 hover:text-indigo-600 transition-colors"
                                    >
                                      <Icon name="copy" className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                  <p className="text-[11px] text-slate-600 font-medium">{item.usage}</p>
                                  <p className="text-[11px] text-slate-500 italic bg-white p-2 rounded-lg border border-slate-100 font-mono leading-relaxed">
                                    "{item.example}"
                                  </p>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 py-4 mt-auto text-center text-xs text-slate-400">
              WritingMaster © 2026 - 純前端免 API Key 寫作評分工具，支援部署於 GitHub Pages
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
