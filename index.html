      // Notification Toast Helper
      const Toast = ({ message, onClose }) => {
        useEffect(() => {

          return () => clearTimeout(timer);

        return (

      };

      // ESSAY TEMPLATES DATASET
      const ESSAY_TEMPLATES = [
        {
          id: 'opinion',
          title: '學術議論文 (Academic Argumentative Essay)',
          category: '學術與考試 (IELTS / TOEFL / 學測)',
          description: '適用於針對爭議性議題表達明確立場，運用邏輯論證、實證例證與反駁觀點。',
          structure: [
            { section: '1. 引言段 (Introduction)', tip: 'Hook + 背景引述 + Clear Thesis Statement', example: 'Recently, the rapid integration of artificial intelligence in education has sparked heated debates. While critics argue that AI undermines critical thinking, I firmly maintain that it acts as a transformative catalyst for personalized learning.' },
            { section: '2. 第一支持段 (Body Paragraph 1)', tip: 'Topic Sentence + 核心論據 + 具體舉例', example: 'To begin with, AI-driven platforms empower students to learn at their tailored pace. For instance, intelligent tutoring systems can dynamically adapt difficulty levels based on individual progress, thereby bridging learning gaps.' },
            { section: '3. 第二支持段 / 對立觀點駁斥 (Counter-Argument & Refutation)', tip: '承認對立觀點 + 展現批判性反駁邏輯', example: 'Admittedly, opponents contend that reliance on AI may induce intellectual laziness. However, this concern overlooks the role of teachers, who can guide students to utilize AI ethically as an auxiliary research tool.' },
            { section: '4. 結論段 (Conclusion)', tip: '重申立場 + 摘要要點 + 終極前瞻展望', example: 'In conclusion, despite potential drawbacks, the benefits of educational AI far outweigh its risks. To thrive in the digital age, educational institutions should actively foster AI literacy rather than impose outright bans.' }
          ]
        },
        {
          id: 'narrative-life',
          title: '個人故事與生活經驗 (Personal Narrative Essay)',
          category: '日常寫作與留學自述 (SOP / Essay)',
          description: '適用於描繪關鍵人生經歷、困境突破、旅行震撼或深遠影響的個人轉折。',
          structure: [
            { section: '1. 故事背景與懸念 (Setting & Hook)', tip: '營造感官細節、交代時間地點與懸念點', example: 'Looking back on my adolescent years, one unexpected cross-country hiking trip completely redefined my perception of resilience.' },
            { section: '2. 危機與轉折 (Rising Action & Challenge)', tip: '深入刻畫內心衝突、突破瞬間與心理變化', example: 'When our team encountered a sudden mountain storm, fear engulfed us. As twilight faded, keeping morale high became far more challenging than navigating the treacherous path.' },
            { section: '3. 體悟與問題解決 (Resolution & Insight)', tip: '說明考驗如何結束以及獲得的生命啟示', example: 'Through mutual support and methodical decision-making, we reached safety by midnight. This ordeal illuminated the extraordinary power of collective perseverance.' },
            { section: '4. 反思結語 (Reflective Conclusion)', tip: '結合當前生活，說明該經歷對未來的深遠意義', example: 'Whenever I confront formidable challenges today, I draw inspiration from that stormy night, remaining calm and steadfast under pressure.' }
          ]
        },
        {
          id: 'complaint-review',
          title: '正式投訴與問題反映信 (Formal Complaint & Feedback Letter)',
          category: '實用書信與生活溝通',
          description: '適用於針對消費品質瑕疵、服務缺失或合約維修爭議提出客觀且強而有力的訴求。',
          structure: [
            { section: '1. 寫信目的與交易背景 (Purpose & Transaction Details)', tip: '明確指出消費日期、訂單編號及開門見山點出主旨', example: 'I am writing to formally register my dissatisfaction regarding the accommodation service provided at your resort from October 12th to 15th (Booking Ref: #8821).' },
            { section: '2. 客觀事實驗證 (Factual Description of the Problem)', tip: '列舉具體不符合品質標準的點，維持冷靜客觀立場', example: 'Upon arrival, the air conditioning unit in Suite 402 was completely inoperable. Despite reporting this issue twice to the front desk, no technician was dispatched during our stay.' },
            { section: '3. 補償要求與解決方案 (Proposed Remedy & Call to Action)', tip: '合理提出退款、折換卷或立即更新處理', example: 'Given the significant inconvenience caused during our family vacation, I believe a partial refund of 30% of the booking fee is both fair and reasonable.' },
            { section: '4. 結尾與明確期限 (Polite Closing with Deadline)', tip: '訂出期待回覆的期限，展現堅定立場', example: 'I trust you will handle this matter with urgency. I look forward to receiving your response and confirmation of refund within five business days.' }
          ]
        },
        {
          id: 'email-formal',
          title: '商務商談與合作 Email (Formal Business Proposal Email)',
          category: '職場與商務應用',
          description: '適用於洽談跨國合作、產品詢價、提案跟進或商務簡報邀請。',
          structure: [
            { section: '1. 專業主旨與稱呼 (Subject & Salutation)', tip: '主旨明確簡潔，使用高階商業稱呼', example: 'Subject: Partnership Proposal: Joint Digital Marketing Campaign Q3\n\nDear Ms. Henderson,' },
            { section: '2. 合作契機與目的 (Purpose & Context)', tip: '引述前情或直接說明寫信意圖', example: 'I am writing on behalf of Nexa Tech to explore potential synergies between our AI platforms and your distribution network in Southeast Asia.' },
            { section: '3. 核心價值與下一步行動 (Value Proposition & Call to Action)', tip: '點出雙贏優勢並約定線上會議時間', example: 'Our analytical tools could enhance your user engagement by 25%. Would you be available for a brief 20-minute video conference next Tuesday at 10:00 AM EST?' },
            { section: '4. 專業簽署 (Professional Sign-off)', tip: '高階禮貌結語與完整簽名檔', example: 'Thank you for your time and consideration. I look forward to your favorable response.\n\nSincerely,\nJohn Doe\nHead of Business Development | Nexa Tech' }
          ]
        },
        {
          id: 'chart-analysis',
          title: '圖表分析與數據報告 (Data & Chart Description Essay)',
          category: '學術與考試 (IELTS Task 1 / 商業報告)',
          description: '適用於描述折線圖、柱狀圖、圓餅圖趨勢，進行數據對比與客觀總結。',
          structure: [
            { section: '1. 圖表轉述 (Overview / Paraphrase)', tip: '改寫題目，說明圖表主題、單位與時間跨度', example: 'The line graph illustrates the fluctuations in renewable energy consumption across five European nations between 2010 and 2023.' },
            { section: '2. 主要趨勢亮點 (Key Features & Main Trends)', tip: '指出最顯著的上升、下降或交叉點，避免列舉細節', example: 'Overall, solar power experienced the most dramatic growth, whereas reliance on coal witnessed a steady decline over the thirteen-year period.' },
            { section: '3. 詳細數據與細節對比 (Detailed Data Comparison)', tip: '運用精確數據與轉折比較詞，分組比較數據', example: 'In 2010, solar energy accounted for a modest 5% of total grid output; however, this figure surged dramatically to 35% by the end of 2023.' },
            { section: '4. 總結觀點 (Concluding Summary)', tip: '對整體趨勢給出簡潔客觀的歸納結論', example: 'In summary, the data clearly reflects a progressive transition toward sustainable energy sources throughout the surveyed timeframe.' }
          ]
        }
      ];

      // TRANSITIONAL WORDS DATASET
      const TRANSITION_WORDS = [
        {
          category: '遞進與補充 (Addition)',
          words: [
            { word: 'Furthermore / Moreover', usage: '此外、再者（用於引出更具說服力的論點）', example: 'Furthermore, implementing green technologies will reduce operational costs in the long run.' },
            { word: 'In addition to', usage: '除了...之外（後接名詞或 V-ing）', example: 'In addition to enhancing memory, quality sleep boosts immune function.' },
            { word: 'Not only... but also', usage: '不僅...而且...（雙重強調語氣）', example: 'The strategic pivot not only saved the venture but also expanded its market share.' }
          ]
        },
        {
          category: '轉折與對比 (Contrast)',
          words: [
            { word: 'However / Nevertheless', usage: '然而、儘管如此（高階轉折副詞）', example: 'The initial market trial faced setback; nevertheless, the team refined the prototype.' },
            { word: 'On the contrary', usage: '恰恰相反（用於否定前言並提出相反事實）', example: 'He is far from inexperienced; on the contrary, he has managed global supply chains for a decade.' },
            { word: 'While / Whereas', usage: '而...相比之下...（常用於句中對比兩事物）', example: 'Desktop sales stagnated, whereas mobile subscription revenue surged.' }
          ]
        },
        {
          category: '因果關係 (Cause & Effect)',
          words: [
            { word: 'Consequently / As a result', usage: '結果是、因此（引出最終邏輯結果）', example: 'Raw material prices escalated; consequently, the profit margin compressed.' },
            { word: 'Therefore / Hence', usage: '因此、由是觀之（學術論述常用推論詞）', example: 'The experimental controls were flawed; hence, the data must be re-evaluated.' },
            { word: 'Due to / Owing to', usage: '由於、因為（後接名詞片語）', example: 'Owing to stringent safety protocols, zero workplace incidents were reported this quarter.' }
          ]
        },
        {
          category: '舉例與闡釋 (Exemplification)',
          words: [
            { word: 'To illustrate / For instance', usage: '舉例來說（較比 For example 更具學術感）', example: 'To illustrate this principle, consider how micro-financing empowered rural entrepreneurs.' },
            { word: 'Specifically / In particular', usage: '具體而言、特別是（用於限縮範圍精準說明）', example: 'The standard applies to all exports, specifically those bound for the European Union.' }
          ]
        },
        {
          category: '總結與歸納 (Concluding)',
          words: [
            { word: 'In conclusion / To sum up', usage: '總而言之、綜上所述（文章最後一段開頭）', example: 'In conclusion, economic growth must be reconciled with ecological preservation.' },
            { word: 'All in all / On the whole', usage: '整體而言、總體來看（簡短綜合觀點）', example: 'All in all, the conference provided invaluable insights into emerging AI trends.' }
          ]
        }
      ];

      // PRESET ESSAY PROMPTS
      const PRESET_PROMPTS = [
        {
          id: 1,
          topic: 'AI與就業前景',
          prompt: 'Do you agree or disagree that artificial intelligence will replace human jobs in the future? Give reasons and examples to support your answer.',
          sampleText: 'In recent years, artificial intelligence has made huge progress. Many people worry that AI will take away millions of human jobs in the near future. I agree with this idea because AI works faster than humans and does not need rest. For example, robots in factories can work 24 hours without making mistakes. Also, AI can write articles and code programs very fast. However, some people think new jobs will be created. But I think many workers will lose their jobs before they can learn new skills. So we must be careful.'
        },
        {
          id: 2,
          topic: '科技與環境永續',
          prompt: 'Some people believe that economic development should take priority over environmental protection. To what extent do you agree or disagree?',
          sampleText: 'Economic development is very important for every country to help people live better lives. However, I strongly disagree that economy should be more important than protecting the environment. If we destroy nature for money, we will face terrible weather and pollution. For example, many factory pollution causes climate change and damages health. Without a clean earth, economic growth is useless. Therefore, protecting environment should always be our first choice.'
        },
        {
          id: 3,
          topic: '遠距與數位學習',
          prompt: 'Online learning has become increasingly popular. Do the advantages of online education outweigh its disadvantages?',
          sampleText: 'With fast internet, online education is getting very popular today. In my opinion, the advantages of online learning are much bigger than its disadvantages. First, students can study anytime and anywhere without travelling. Second, online platforms offer many free courses from top universities. On the other hand, students might lack self-discipline and miss social life. But overall, flexibility makes online learning a great choice.'
        },
        {
          id: 4,
          topic: '社群媒體與心理健康',
          prompt: 'Discuss both the positive and negative impacts of social media on young people.',
          sampleText: 'Social media like Instagram and TikTok are part of daily life for teenagers. On the positive side, social media helps young people stay connected with friends and learn news instantly. However, the negative impact is also serious. Many teenagers spend too much time scrolling and feel anxious when comparing themselves to others online. Cyberbullying is another big problem. In conclusion, social media brings convenience but also mental health pressure.'
        },
        {
          id: 5,
          topic: '工作與生活平衡',
          prompt: 'Many employees struggle to achieve a work-life balance in modern society. What are the causes of this problem, and what solutions can be proposed?',
          sampleText: 'Today, work-life balance has become a big challenge for many workers. The main cause is smart phones, because boss can send messages anytime even after working hours. Another reason is heavy workload in competitive companies. To solve this problem, companies should set rules that ban late night emails. Also, workers need to manage their time better and learn to relax during weekends.'
        }
      ];

      // PRESET SENTENCES FOR ENHANCER TOOL
      const ENHANCER_PRESETS = [
        "I think this idea is very good and useful.",
        "This problem is very bad and makes people unhappy.",
        "Many people believe that money can buy happiness.",
        "The government should give more money to help poor students."
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('editor'); // 'editor' | 'templates' | 'transitions'
        const [selectedPromptId, setSelectedPromptId] = useState(1);
        const [essayPrompt, setEssayPrompt] = useState(PRESET_PROMPTS[0].prompt);
        const [userEssay, setUserEssay] = useState(PRESET_PROMPTS[0].sampleText);
        
        // AI Review State
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const [aiFeedback, setAiFeedback] = useState(null);
        const [apiError, setApiError] = useState(null);

        // Toast State
        const [toastMsg, setToastMsg] = useState(null);

        // Transition tab states
        const [searchKeyword, setSearchKeyword] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');

        // Sentence Enhancer states
        const [inputSentence, setInputSentence] = useState(ENHANCER_PRESETS[0]);
        const [isEnhancing, setIsEnhancing] = useState(false);
        const [enhancements, setEnhancements] = useState(null);

        // Word Count calculation
        const wordStats = useMemo(() => {
          const trimmed = userEssay.trim();
          if (!trimmed) return { words: 0, chars: 0, readingTime: 0 };
          const words = trimmed.split(/\s+/).filter(Boolean).length;
          const chars = userEssay.length;
          const readingTime = Math.ceil(words / 200); // 200 wpm average
          return { words, chars, readingTime };
        }, [userEssay]);

        const showToast = (msg) => {
          setToastMsg(msg);
        };

        const handleSelectPrompt = (p) => {
          setSelectedPromptId(p.id);
          setEssayPrompt(p.prompt);
          setUserEssay(p.sampleText);
          setAiFeedback(null);
          setApiError(null);
        };

        const handleCopyText = (text, label = "內容") => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            showToast(`已複製 ${label} 至剪貼簿！`);
          } catch (err) {
            console.error('Copy failed', err);
          }
          document.body.removeChild(textarea);
        };

        // Gemini API Essay Analysis
        const analyzeEssayWithGemini = async () => {
          if (!userEssay.trim()) {
            alert('請先輸入或粘貼您的英文文章！');
            return;
          }

          setIsAnalyzing(true);
          setAiFeedback(null);
          setApiError(null);

          const apiKey = ""; // Canvas runtime auto-injects
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const systemPrompt = `你是一位權威的英文寫作指導教授與雅思/托福權威考官。請依據使用者提供的作文題目與草稿內容進行精細的實時批改。請嚴格以繁體中文 (zh-TW) 提供回覆，唯獨英文範例與句子保持英文。
請使用 JSON 格式輸出，必須符合以下 Schema Structure：{  "overallScore": 82, (0-100分的綜合評分)  "scoreBreakdown": {    "grammarAndVocab": "文法與詞彙多樣性評語",    "structureAndCoherence": "文章結構與句構連貫性評語",    "contentAndTaskAchievement": "內容切題度與論證深度評語"  },  "strengths": ["優點點評 1", "優點點評 2"],  "weaknesses": ["需改進點 1", "需改進點 2"],  "grammarCorrections": [    {      "original": "原本有瑕疵或錯誤的句子",      "corrected": "修正後高階道地的英文句子",      "reason": "詳細中文說明文法錯誤、用語不當或潤飾原因"    }  ],  "improvedVersion": "完全重寫潤飾後的高分英文範本全文 (劃分為清晰段落)"}`;

          const userQuery = `【寫作題目】：${essayPrompt}\n\n【學生作文草稿】：\n${userEssay}`;
          const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json"

                          onClick={enhanceSentenceWithGemini}
                          disabled={isEnhancing}
                          className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center space-x-2 flex-shrink-0"
                        >
                          {isEnhancing ? (
                            <>
                              <Icon name="refresh-cw" className="w-4 h-4 animate-spin" />
                              <span>句型升級中...</span>
                            </>
                          ) : (
                            <>
                              <Icon name="sparkles" className="w-4 h-4" />
                              <span>一鍵升級句型</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>

                    {enhancements && (
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-slate-100 animate-fadeIn">
                        <div className="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl space-y-2">
                          <span className="text-xs font-bold text-indigo-700 uppercase tracking-wider block">🎓 學術風格 (Academic)</span>
                          <p className="text-xs font-bold text-slate-800 leading-snug">{enhancements.academic?.sentence}</p>
                          <p className="text-[11px] text-slate-500 font-medium border-t border-indigo-100/60 pt-2">{enhancements.academic?.explanation}</p>
                          <button
                            onClick={() => handleCopyText(enhancements.academic?.sentence, "學術句型")}
                            className="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製此句</span>
                          </button>
                        </div>

                        <div className="p-4 bg-slate-50 border border-slate-200/80 rounded-xl space-y-2">
                          <span className="text-xs font-bold text-slate-700 uppercase tracking-wider block">💼 商務正式 (Formal Business)</span>
                          <p className="text-xs font-bold text-slate-800 leading-snug">{enhancements.business?.sentence}</p>
                          <p className="text-[11px] text-slate-500 font-medium border-t border-slate-200/60 pt-2">{enhancements.business?.explanation}</p>
                          <button
                            onClick={() => handleCopyText(enhancements.business?.sentence, "商務句型")}
                            className="text-[11px] font-bold text-slate-600 hover:text-slate-800 flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製此句</span>
                          </button>
                        </div>

                        <div className="p-4 bg-purple-50/50 border border-purple-100 rounded-xl space-y-2">
                          <span className="text-xs font-bold text-purple-700 uppercase tracking-wider block">✨ 生動修辭 (Vivid/Expressive)</span>
                          <p className="text-xs font-bold text-slate-800 leading-snug">{enhancements.vivid?.sentence}</p>
                          <p className="text-[11px] text-slate-500 font-medium border-t border-purple-100/60 pt-2">{enhancements.vivid?.explanation}</p>
                          <button
                            onClick={() => handleCopyText(enhancements.vivid?.sentence, "修辭句型")}
                            className="text-[11px] font-bold text-purple-600 hover:text-purple-800 flex items-center space-x-1 pt-1"
                          >
                            <Icon name="copy" className="w-3 h-3" />
                            <span>複製此句</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Transition Words Dataset Section */}
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                      <div>
                        <h2 className="text-base font-extrabold text-slate-800">高階轉折詞與連詞辭典 (Transition Words)</h2>
                        <p className="text-xs text-slate-500 font-medium">提升文章組織與句構連貫性的核心轉折片語。</p>
                      </div>

                      {/* Filters */}
                      <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                        <div className="relative flex-1 sm:w-48">
                          <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                          <input
                            type="text"
                            value={searchKeyword}
                            onChange={(e) => setSearchKeyword(e.target.value)}
                            placeholder="搜尋轉折詞..."
                            className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <select
                          value={selectedCategory}
                          onChange={(e) => setSelectedCategory(e.target.value)}
                          className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-indigo-500"
                        >
                          <option value="All">全部分類</option>
                          <option value="Addition">遞進補充</option>
                          <option value="Contrast">轉折對比</option>
                          <option value="Cause & Effect">因果關係</option>
                          <option value="Exemplification">舉例闡釋</option>
                          <option value="Concluding">總結歸納</option>
                        </select>
                      </div>
                    </div>

                    {/* Dictionary Grid */}
                    <div className="space-y-6">
                      {filteredTransitions.map((cat, idx) => (
                        <div key={idx} className="space-y-3">
                          <h3 className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider flex items-center space-x-1.5">
                            <span className="w-2 h-2 rounded-full bg-indigo-600"></span>
                            <span>{cat.category}</span>
                          </h3>
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {cat.words.map((item, wIdx) => (
                              <div key={wIdx} className="p-4 bg-slate-50 border border-slate-200/70 rounded-xl space-y-2 hover:border-indigo-300 transition-all flex flex-col justify-between">
                                <div className="space-y-1">
                                  <div className="flex justify-between items-center">
                                    <span className="text-sm font-extrabold text-slate-900">{item.word}</span>
                                    <button
                                      onClick={() => handleCopyText(item.word, "轉折詞")}
                                      className="text-slate-400 hover:text-indigo-600 transition-colors"
                                      title="複製轉折詞"
                                    >
                                      <Icon name="copy" className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                  <p className="text-xs font-semibold text-indigo-600">{item.usage}</p>
                                </div>
                                <p className="text-xs text-slate-600 font-medium italic border-t border-slate-200/60 pt-2 mt-2">
                                  "{item.example}"
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}

                      {filteredTransitions.length === 0 && (
                        <div className="text-center py-12 text-slate-400 font-medium text-xs">
                          查無符合條件的轉折詞。
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      // Render App into DOM
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
